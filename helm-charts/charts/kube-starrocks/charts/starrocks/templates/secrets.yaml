{{- range .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
type: Opaque
data:
  {{- range $key, $value := .data }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
  {{- end }}
---
{{- end }}

{{- if .Values.starrocksFESpec.entrypoint }}
---
{{/* the entrypoint script of the FE. It is a Secret, not a ConfigMap: the operator mounts nothing else. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "starrockscluster.fe.entrypoint.script.secret.name" . }}
  namespace: {{ template "starrockscluster.namespace" . }}
type: Opaque
stringData:
  {{ template "starrockscluster.entrypoint.script.name" . }}: |
    {{- .Values.starrocksFESpec.entrypoint.script | nindent 4 }}
{{- end }}

