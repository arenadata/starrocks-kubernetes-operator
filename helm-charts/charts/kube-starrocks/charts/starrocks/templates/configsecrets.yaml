{{/*
The configuration of FE/BE/CN. It is a Secret, not a ConfigMap: it carries credentials such as the LDAP
bind password or the keystore passwords, and it is mounted over the conf directory of the installation.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "starrockscluster.fe.config.secret.name" . }}
  namespace: {{ template "starrockscluster.namespace" . }}
  labels:
    cluster: {{ template "starrockscluster.name" . }}
    app: "fe"
type: Opaque
stringData:
  {{- include "starrockscluster.fe.config" . | nindent 2 }}

{{- if and .Values.starrocksCluster.enabledBe .Values.starrocksBeSpec .Values.starrocksBeSpec.config }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "starrockscluster.be.config.secret.name" . }}
  namespace: {{ template "starrockscluster.namespace" . }}
  labels:
    cluster: {{ template "starrockscluster.name" . }}
    app: "be"
type: Opaque
stringData:
  {{- include "starrockscluster.be.config" . | nindent 2 }}
{{- end }}

{{- if and .Values.starrocksCluster.enabledCn .Values.starrocksCnSpec .Values.starrocksCnSpec.config }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "starrockscluster.cn.config.secret.name" . }}
  namespace: {{ template "starrockscluster.namespace" . }}
  labels:
    cluster: {{ template "starrockscluster.name" . }}
    app: "cn"
type: Opaque
stringData:
  {{- include "starrockscluster.cn.config" . | nindent 2 }}
{{- end }}
