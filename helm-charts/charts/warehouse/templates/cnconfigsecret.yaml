{{/*
The configuration of the compute nodes. It is a Secret, not a ConfigMap: it may carry credentials and it
is mounted over the conf directory of the installation, from where the CN reads it directly.
*/}}
{{- if and .Values.spec .Values.spec.config }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "starrockswarehouse.config.secret.name" . }}
  namespace: {{ template "starrockswarehouse.namespace" . }}
  labels:
    warehouse: {{ template "starrockswarehouse.name" . }}
    app: "warehouse"
type: Opaque
stringData:
  {{- include "starrockswarehouse.config" . | nindent 2 }}
{{- end }}
