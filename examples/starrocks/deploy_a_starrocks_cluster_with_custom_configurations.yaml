# This manifest deploys a StarRocks cluster with FE, BE, CN, and mount their own config
# By default, the StarRocks cluster will use the default configuration file.
# This configuration might not be apt for your specific environment; for instance, the
# default -Xmx8192m setting for FE could potentially lead to JVM Out Of Memory issues.
# FE default config: https://github.com/StarRocks/starrocks/blob/main/conf/fe.conf
# BE default config: https://github.com/StarRocks/starrocks/blob/main/conf/be.conf
# CN default config: https://github.com/StarRocks/starrocks/blob/main/conf/cn.conf

apiVersion: starrocks.com/v1
kind: StarRocksCluster
metadata:
  name: a-starrocks-with-custom-config   # change the name if needed.
spec:
  starRocksFeSpec:
    image: starrocks/fe-ubuntu:latest
    replicas: 3
    limits:
      cpu: 8
      memory: 16Gi
    requests:
      cpu: 8
      memory: 16Gi
    secrets:
      - name: starrockscluster-sample-fe-conf
        mountPath: /opt/starrocks/fe/conf
  starRocksBeSpec:
    image: starrocks/be-ubuntu:latest
    replicas: 3
    limits:
      cpu: 16
      memory: 64Gi
    requests:
      cpu: 16
      memory: 64Gi
    secrets:
      - name: starrockscluster-sample-be-conf
        mountPath: /opt/starrocks/be/conf
  starRocksCnSpec:
    image: starrocks/cn-ubuntu:latest
    replicas: 1
    limits:
      cpu: 16
      memory: 64Gi
    requests:
      cpu: 16
      memory: 64Gi
    secrets:
      - name: starrockscluster-sample-cn-conf
        mountPath: /opt/starrocks/cn/conf

---

# fe config
apiVersion: v1
kind: Secret
metadata:
  name: starrockscluster-sample-fe-conf
  labels:
    cluster: starrockscluster-sample
type: Opaque
stringData:
  fe.conf: |
    LOG_DIR = ${STARROCKS_HOME}/log
    DATE = "$(date +%Y%m%d-%H%M%S)"
    JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx8192m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    mysql_service_nio_enabled = true
    sys_log_level = INFO

---

# be config
apiVersion: v1
kind: Secret
metadata:
  name: starrockscluster-sample-be-conf
  labels:
    cluster: starrockscluster-sample
type: Opaque
stringData:
  be.conf: |
    be_port = 9060
    webserver_port = 8040
    heartbeat_service_port = 9050
    brpc_port = 8060
    sys_log_level = INFO
    default_rowset_type = beta

---

# cn config
apiVersion: v1
kind: Secret
metadata:
  name: starrockscluster-sample-cn-conf
  labels:
    cluster: starrockscluster-sample
type: Opaque
stringData:
  cn.conf: |
    sys_log_level = INFO
    # ports for admin, web, heartbeat service
    thrift_port = 9060
    webserver_port = 8040
    heartbeat_service_port = 9050
    brpc_port = 8060
